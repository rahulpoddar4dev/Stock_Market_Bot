<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Trading Bot</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-blue: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-glow: rgba(37, 99, 235, 0.35);
      --success: #10b981;
      --danger: #ef4444;
      --input-bg: #0c121e;
      --input-border: #26334d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 15%, #17223b 0%, #090d16 65%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px var(--accent-glow);
      padding: 36px 32px;
      backdrop-filter: blur(8px);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      border-radius: 14px;
      font-size: 28px;
      margin-bottom: 14px;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.4);
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .brand p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .status-badge-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      font-size: 11px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .status-pill.broker {
      background: rgba(37, 99, 235, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(37, 99, 235, 0.25);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.4;
      display: none;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      display: block;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      display: block;
    }

    .btn-fyers {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 18px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .btn-fyers:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.55);
      transform: translateY(-1px);
    }

    .btn-fyers:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #4b5563;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #1f2937;
    }

    .divider span {
      padding: 0 10px;
    }

    .manual-box label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .manual-box input {
      width: 100%;
      padding: 11px 13px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .manual-box input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .btn-submit {
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
      background: #1f293d;
      color: #93c5fd;
      border: 1px solid #2d3e5e;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #273652;
      color: #ffffff;
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #6b7280;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">
      <div class="brand-icon">📈</div>
      <h1>Trading Bot</h1>
      <p>Broker Login Required to Access Dashboard</p>
    </div>

    <div class="status-badge-row">
      <div class="status-pill" id="dbBadge">
        <span class="dot"></span>
        <span id="dbBadgeText">MongoDB Atlas</span>
      </div>
      <div class="status-pill broker">
        <span class="dot"></span>
        <span>Fyers API v3</span>
      </div>
    </div>

    <div id="alertBox" class="alert"></div>

    <a href="/fyers/login" class="btn-fyers" id="fyersLoginBtn">
      <span>⚡</span>
      <span>Login with Fyers</span>
    </a>

    <div class="divider">
      <span>Or Enter Auth Code</span>
    </div>

    <div class="manual-box">
      <label for="authCodeInput">Auth Code or Redirect URL</label>
      <input type="text" id="authCodeInput" placeholder="Paste auth code or redirect URL here..." autocomplete="off">
      <button class="btn-submit" id="submitBtn">Verify & Enter Dashboard</button>
    </div>

    <div class="footer-note">
      🔒 Secure OAuth 2.0 broker connection.<br>
      Trading Bot Dashboard will unlock once broker session is active.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById("alertBox");

    if (params.get("logged_out") === "true") {
      alertBox.className = "alert success";
      alertBox.textContent = "You have been logged out successfully. Sign in to continue.";
      alertBox.style.display = "block";
    } else if (params.get("error")) {
      alertBox.className = "alert error";
      alertBox.textContent = decodeURIComponent(params.get("error"));
      alertBox.style.display = "block";
    }

    // Auto-check if already logged in
    async function checkAuth() {
      try {
        const res = await fetch("/api/auth-status");
        if (res.ok) {
          const data = await res.json();
          if (data.active) {
            window.location.href = "/";
            return;
          }
          if (data.db_status) {
            const dbText = document.getElementById("dbBadgeText");
            if (dbText) dbText.textContent = data.db_status.engine || "MongoDB Atlas";
          }
        }
      } catch (e) {
        // Continue showing login page
      }
    }
    checkAuth();

    // Handle manual auth code submission
    const submitBtn = document.getElementById("submitBtn");
    const authInput = document.getElementById("authCodeInput");

    submitBtn.addEventListener("click", async () => {
      const code = (authInput.value || "").trim();
      if (!code) {
        alertBox.className = "alert error";
        alertBox.textContent = "Please enter an auth code or redirect URL.";
        alertBox.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying...";
      alertBox.style.display = "none";

      try {
        const res = await fetch("/api/fyers/submit-token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token_or_url: code })
        });
        const result = await res.json();
        if (result.ok) {
          alertBox.className = "alert success";
          alertBox.textContent = "Login successful! Redirecting to dashboard...";
          alertBox.style.display = "block";
          setTimeout(() => {
            window.location.href = "/";
          }, 800);
        } else {
          alertBox.className = "alert error";
          alertBox.textContent = "Authentication failed: " + (result.error || "Invalid code");
          alertBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Verify & Enter Dashboard";
        }
      } catch (err) {
        alertBox.className = "alert error";
        alertBox.textContent = "Network error: " + err;
        alertBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Verify & Enter Dashboard";
      }
    });

    authInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        submitBtn.click();
      }
    });
  </script>
</body>
</html>
